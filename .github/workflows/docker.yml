# Builds the zkevinly-web container image. On every merge to main (and on demand) it is pushed to
# ghcr.io/<owner>/zkevinly-web as :latest and :<commit>; on pull requests it only builds, so a
# broken Dockerfile fails the PR. The Cloudflare deploy in ci.yml is unaffected.
#
# Run `npm run pin-actions` to pin these actions by SHA like the other workflows.
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths:
      [
        Dockerfile,
        .dockerignore,
        compose.yaml,
        server/**,
        worker/**,
        package*.json,
        packages/**,
        src/**,
        public/**,
        astro.config.mjs,
        .github/workflows/docker.yml,
      ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR (skipped on pull requests)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Image name (GHCR needs lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zkevinly-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          # Lets the build read release/commit info for the project cards (the repo's own token can
          # only see this repo; private ones just hide their badges).
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
