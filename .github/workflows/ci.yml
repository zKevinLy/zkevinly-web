name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR cancels the older run. Never cancel on main: a deploy that
# is cut off half way (deployed but not tagged) is worse than waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fixes what can be fixed and commits it, so nobody has to remember to run
  # `npm run ci:fix`. Runs `lint:fix` and `format` (see package.json).
  # Skipped for Dependabot and fork PRs, whose tokens are read-only.
  # Commits pushed with GITHUB_TOKEN don't start new workflow runs, so this run verifies
  # and deploys the fixed commit itself (see `needs.autofix.outputs.sha`).
  autofix:
    name: Auto-fix lint & formatting
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the fix commit
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR run would otherwise check out the merge commit, which can't be pushed to.
          ref: ${{ github.head_ref || github.ref_name }}
          # Unlike the other jobs, this one must keep the token so `git push` works.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fix lint and formatting
        run: |
          # Problems that can't be auto-fixed are left for the verify job to report.
          npm run lint:fix || true
          npm run format

      - name: Commit and push the fixes
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing to fix."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: auto-fix lint and formatting"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Everything `npm run ci` does: lint, format check, unit tests, type check + build, audit.
  verify:
    name: Lint, test & build
    needs: autofix
    # Run even when autofix was skipped, but not when it failed (e.g. a push race).
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.autofix.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.autofix.outputs.sha || github.sha }} # includes the auto-fix commit
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run CI checks
        run: npm run ci
        env:
          # Avoids GitHub's 60 requests/hour unauthenticated limit when RepoMeta
          # fetches release info at build time. SITE_GITHUB_TOKEN (a fine-grained PAT with
          # read-only Contents + Metadata on the private repos) lets it see those too;
          # the default token only reads this repo.
          # PR runs execute branch code, so only pushes to main get the private-repo PAT.
          GITHUB_TOKEN: ${{ (github.event_name == 'push' && secrets.SITE_GITHUB_TOKEN) || secrets.GITHUB_TOKEN }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore

  # Only for pushes to main that passed verify. Deploy first, tag after: a failed
  # deploy means no release and no tag.
  deploy:
    name: Deploy & release
    needs: [autofix, verify]
    # Not plain success(): autofix may be skipped, which would otherwise skip the deploy.
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write # create the tag + GitHub Release
    # Two pushes in quick succession must not compute the same version.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.autofix.outputs.sha || github.sha }} # includes the auto-fix commit
          fetch-depth: 0 # next-version.sh reads the full history...
          fetch-tags: true # ...and the existing v* tags
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Work out the next version
        id: version
        run: echo "tag=$(bash .github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build (stamped with the version)
        # `verify` already ran the type check; this is the build that ships.
        run: |
          printf '{"version":"%s","commit":"%s","builtAt":"%s"}\n' \
            "$TAG" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/version.json
          npm run build:fast
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ needs.autofix.outputs.sha || github.sha }}
          PUBLIC_APP_VERSION: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.SITE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npm run deploy # wrangler deploy (see wrangler.toml)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The browser reads private-repo info through the Worker (/api/repo), which needs its own
      # copy of the token: GitHub environment secrets never reach Cloudflare by themselves.
      - name: Sync Worker secret (GITHUB_TOKEN)
        run: |
          if [ -z "$SITE_GITHUB_TOKEN" ]; then
            echo "SITE_GITHUB_TOKEN not set; skipping."
          else
            printf '%s' "$SITE_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          fi
        env:
          SITE_GITHUB_TOKEN: ${{ secrets.SITE_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Tag and create the GitHub Release
        run: |
          (cd dist && zip -qr "../site-${TAG}.zip" .)
          gh release create "$TAG" "site-${TAG}.zip" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ needs.autofix.outputs.sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
