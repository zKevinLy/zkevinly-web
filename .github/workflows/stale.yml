name: Stale

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security,dependencies
          stale-issue-message: This issue has gone quiet and will close soon unless there's new activity.
          stale-pr-message: This PR has gone quiet and will close soon unless there's new activity.
